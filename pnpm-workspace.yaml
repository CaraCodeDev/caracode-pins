packages:
  - packages/*
  - playground

# Dependencies allowed to run install scripts. pnpm 11+ fails the install
# (strictDepBuilds) for any dependency with scripts that isn't listed here.
allowBuilds:
  esbuild: true

# Added by pnpm on first install: these versions were newer than pnpm's
# minimumReleaseAge window on 2026-09-23. Safe to drop once they age past it.
minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.2'
  - astro@7.3.4
